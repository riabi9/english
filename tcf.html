<style>
:root{--bg:#f5f4f3;--card:#fff;--ink:#1f1e1d;--mut:#5f5e5a;--line:#e1e0d9;--acc:#4f46e5;--acc-soft:#eef2ff;--ok:#0a7d3b;--ok-bg:#e5f4e4;--ok-line:#55bf50;--bad:#b93535;--bad-bg:#fbebeb;--bad-line:#ec7e7e;--warn:#b45309;--warn-bg:#fef3c7;--r:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171716;--card:#232322;--ink:#f1f0ec;--mut:#aaa9a2;--line:#3a3a37;--acc:#818cf8;--acc-soft:#2a2c4a;--ok:#6fd49a;--ok-bg:#1c3326;--ok-line:#2f7d4d;--bad:#f08a8a;--bad-bg:#3a2020;--bad-line:#8a3a3a;--warn:#f5c36b;--warn-bg:#3a2e14}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:24px;margin:0}
.sub{color:var(--mut);font-size:14px;margin:2px 0 0}
button,.btn{font:inherit;font-size:14px;padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{background:var(--acc-soft)}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--acc);border-color:var(--acc);color:#fff}.primary:hover{filter:brightness(1.08);background:var(--acc)}
.danger{color:var(--bad);border-color:var(--bad-line)}.danger:hover{background:var(--bad-bg)}
.small{padding:4px 9px;font-size:12.5px}
input,select,textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
textarea{resize:vertical;min-height:60px}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;align-items:center}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--acc-soft);color:var(--acc)}
.badge.g{background:var(--ok-bg);color:var(--ok)}.badge.w{background:var(--warn-bg);color:var(--warn)}.badge.m{background:var(--line);color:var(--mut)}
.sim h3{margin:8px 0 4px;font-size:17px}.sim p{margin:0 0 10px;color:var(--mut);font-size:13.5px}
.sim .meta{font-size:12.5px;color:var(--mut);margin-bottom:12px}
.hidden{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);border-radius:3px}

.qtext{font-size:17px;font-weight:600;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;width:100%;padding:11px 14px;font-size:15px}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.fb{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:14px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.bad{background:var(--bad-bg);color:var(--bad)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.nav button{padding:3px 0;width:32px;justify-content:center;font-size:12.5px}
.nav button.done{background:var(--acc-soft);border-color:var(--acc)}.nav button.cur{background:var(--acc);color:#fff;border-color:var(--acc)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat{background:var(--bg);border-radius:10px;padding:14px}.stat b{display:block;font-size:26px}.stat span{font-size:13px;color:var(--mut)}
.cat{margin-bottom:12px;font-size:13.5px}.cat .l{display:flex;justify-content:space-between;margin-bottom:4px}
.rev{border-top:1px solid var(--line);padding:10px 0;font-size:14px}.rev small{color:var(--mut)}

.tw{overflow-x:auto}

.drop.over{border-color:var(--acc);background:var(--acc-soft)}
.imp{margin-top:14px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:12.5px;margin-top:6px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
.modal>.card{width:100%;max-width:880px;margin:auto}

.toast.err{background:#b91c1c}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}

<script>
'use strict';
// ====================== config ======================
const SUPABASE_URL = "https://fmmfofjkebdsrnkchrfo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtbWZvZmprZWJkc3Jua2NocmZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MDAxNDIsImV4cCI6MjA5MjA3NjE0Mn0.bQQJt06mucLCQCrY1NgN-ed2ngDeRLmITmOfQCAM7ZU";
const ADMIN_PASSWORD = "19990";    // same password as the classroom portal
const SKILLS = { grammar: 'Structures de la langue', reading: 'Compréhension écrite', listening: 'Compréhension orale', vocabulary: 'Vocabulaire', writing: 'Expression écrite', other: 'Autre' };
const LEVELS = ['', 'A1', 'A2', 'B1', 'B2', 'C1', 'C2'];

let sb = null;
try { if (window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { console.error(e); }

// ====================== helpers ======================
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v === null || v === undefined) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (k in el && k !== 'list') { try { el[k] = v; } catch (e) { el.setAttribute(k, v); } }
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
}
function toast(msg, err) { const t = h('div', { class: 'toast' + (err ? ' err' : '') }, msg); document.body.append(t); setTimeout(() => t.remove(), err ? 6000 : 2600); }
function setView(...nodes) { const v = $('#view'); v.replaceChildren(...nodes); window.scrollTo(0, 0); }
function showBanner(msg) { $('#banner').replaceChildren(msg ? h('div', { class: 'banner' }, msg) : ''); }
const fmtTime = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const deep = o => JSON.parse(JSON.stringify(o));
function ls(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

// ====================== data layer ======================
const COLS = 'id,title,skill,level,description,minutes,q_count,sort,published,created_at';
const SETUP_HINT = 'Run tcf-setup.sql in the Supabase SQL editor first (the TCF tables do not exist yet).';
async function dbListSims(admin) {
  if (!sb) throw new Error('Supabase is not available. Check your internet connection.');
  let q = sb.from('tcf_sims').select(COLS).order('sort', { ascending: true }).order('id', { ascending: true });
  if (!admin) q = q.eq('published', true);
  const { data, error } = await q; if (error) throw error; return data || [];
}
async function dbGetSim(id) { const { data, error } = await sb.from('tcf_sims').select('*').eq('id', id).single(); if (error) throw error; return data; }
async function dbSaveSim(row) {
  const rec = { title: row.title, skill: row.skill, level: row.level || '', description: row.description || '', minutes: +row.minutes || 0, published: !!row.published, data: row.data, q_count: row.data.questions.length, updated_at: new Date().toISOString() };
  if (row.id) { const { error } = await sb.from('tcf_sims').update(rec).eq('id', row.id); if (error) throw error; return row.id; }
  if (row.sort !== undefined) rec.sort = row.sort;
  const { data, error } = await sb.from('tcf_sims').insert([rec]).select('id').single(); if (error) throw error; return data.id;
}

// ====================== quiz data: parse / validate ======================
function extractLiteral(src, name) {           // returns the JS literal text assigned to `var|let|const name =`
  const m = new RegExp('(?:var|let|const)\\s+' + name + '\\s*=\\s*').exec(src); if (!m) return null;
  let i = m.index + m[0].length; const open = src[i]; const close = open === '[' ? ']' : open === '{' ? '}' : null; if (!close) return null;
  let depth = 0, str = null;
  for (let j = i; j < src.length; j++) {
    const c = src[j];
    if (str) { if (c === '\\') j++; else if (c === str) str = null; continue; }
    if (c === '"' || c === "'" || c === '`') { str = c; continue; }
    if (c === '/' && src[j + 1] === '/') { while (j < src.length && src[j] !== '\n') j++; continue; }
    if (c === '/' && src[j + 1] === '*') { j = src.indexOf('*/', j + 2); if (j < 0) return null; j++; continue; }
    if (c === open) depth++; else if (c === close) { depth--; if (depth === 0) return src.slice(i, j + 1); }
  }
  return null;
}
function evalLiteral(lit) { return (new Function('"use strict"; return (' + lit + ');'))(); }
function normalizeData(raw) {                  // raw: {questions, texts?, categoryNames?}; returns {data, warnings}
  const warnings = [], out = { texts: [], categoryNames: {}, questions: [] };
  if (!raw || !Array.isArray(raw.questions)) return { data: out, warnings: ['No "questions" list found.'] };
  (Array.isArray(raw.texts) ? raw.texts : []).forEach(t => out.texts.push({ title: String(t.title || ''), content: String(t.content || '') }));
  const cn = raw.categoryNames && typeof raw.categoryNames === 'object' ? raw.categoryNames : {};
  raw.questions.forEach((q, i) => {
    const n = i + 1;
    if (!q || typeof q.prompt !== 'string' || !q.prompt.trim()) { warnings.push(`Question ${n} skipped: no text.`); return; }
    const options = Array.isArray(q.options) ? q.options.map(o => String(o)) : [];
    if (options.length < 2) { warnings.push(`Question ${n} skipped: needs at least 2 options.`); return; }
    const ci = Number(q.correctIndex);
    if (!Number.isInteger(ci) || ci < 0 || ci >= options.length) { warnings.push(`Question ${n} skipped: correctIndex is missing or out of range.`); return; }
    const cat = String(q.category || 'general');
    if (!out.categoryNames[cat]) out.categoryNames[cat] = cn[cat] ? String(cn[cat]) : (cat === 'general' ? 'Général' : cat.charAt(0).toUpperCase() + cat.slice(1));
    const nq = { category: cat, prompt: q.prompt, options, correctIndex: ci, explanation: String(q.explanation || '') };
    if (q.textIndex !== undefined && q.textIndex !== null && out.texts[q.textIndex]) nq.textIndex = Number(q.textIndex); else if (q.textIndex !== undefined && q.textIndex !== null) warnings.push(`Question ${n}: passage ${q.textIndex} does not exist; passage link removed.`);
    if (!nq.explanation) warnings.push(`Question ${n} has no explanation.`);
    out.questions.push(nq);
  });
  if (!out.questions.length) warnings.push('No valid question found.');
  return { data: out, warnings };
}
function parseQuizFile(name, text) {           // .html or .json -> {title, skill, data, warnings}
  const base = name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
  let title = base.charAt(0).toUpperCase() + base.slice(1), raw;
  if (/\.json$/i.test(name)) {
    const j = JSON.parse(text);
    if (j.data && j.data.questions) { return { title: j.title || title, skill: j.skill || 'other', level: j.level || '', description: j.description || '', minutes: j.minutes || 0, ...normalizeData(j.data) }; }
    raw = j;
  } else {
    const doc = new DOMParser().parseFromString(text, 'text/html');
    const tt = doc.querySelector('title'); if (tt && tt.textContent.trim()) title = tt.textContent.trim();
    const src = [...doc.querySelectorAll('script:not([src])')].map(s => s.textContent).join('\n');
    const q = extractLiteral(src, 'questions'); if (!q) throw new Error('Could not find the "questions" list in this file.');
    raw = { questions: evalLiteral(q) };
    const t = extractLiteral(src, 'texts'); if (t) raw.texts = evalLiteral(t);
    const c = extractLiteral(src, 'categoryNames'); if (c) raw.categoryNames = evalLiteral(c);
  }
  const { data, warnings } = normalizeData(raw);
  const skill = data.texts.length ? 'reading' : (/vocab/i.test(name) ? 'vocabulary' : 'grammar');
  return { title, skill, level: '', description: '', minutes: 0, data, warnings };
}

// ====================== student: library ======================
let state = { sims: [], filter: 'all', search: '', admin: false };
const bestOf = id => ls('tcf_best_' + id);

async function showLibrary() {
  stopTimer();
  state.admin = false; $('#admin-btn').classList.remove('hidden'); $('#to-student').classList.add('hidden');
  $('#subtitle').textContent = 'Entraîne-toi avec des simulations corrigées.';
  setView(h('div', { class: 'empty' }, 'Chargement…'));
  try { state.sims = await dbListSims(false); showBanner(''); }
  catch (e) { console.error(e); state.sims = []; showBanner(/relation|does not exist|schema cache/i.test(e.message || '') ? SETUP_HINT : 'Impossible de charger les simulations : ' + (e.message || e)); }
  renderLibrary();
}
function renderLibrary() {
  const skills = [...new Set(state.sims.map(s => s.skill))];
  const chips = h('div', { class: 'chips' },
    h('button', { class: 'chip' + (state.filter === 'all' ? ' on' : ''), onclick: () => { state.filter = 'all'; renderLibrary(); } }, 'Tout'),
    skills.map(k => h('button', { class: 'chip' + (state.filter === k ? ' on' : ''), onclick: () => { state.filter = k; renderLibrary(); } }, SKILLS[k] || k)),
    h('span', { class: 'sp' }),
    h('input', { type: 'search', placeholder: 'Rechercher…', value: state.search, style: 'max-width:220px', oninput: e => { state.search = e.target.value; renderGrid(); } }));
  const grid = h('div', { class: 'grid', id: 'lib-grid' });
  setView(chips, grid); renderGrid();
}
function renderGrid() {
  const grid = $('#lib-grid'); if (!grid) return;
  const q = state.search.trim().toLowerCase();
  const list = state.sims.filter(s => (state.filter === 'all' || s.skill === state.filter) && (!q || (s.title + ' ' + s.description).toLowerCase().includes(q)));
  if (!list.length) { grid.replaceChildren(h('div', { class: 'empty' }, state.sims.length ? 'Aucun résultat.' : 'Aucune simulation disponible pour le moment.')); return; }
  grid.replaceChildren(...list.map(s => {
    const b = bestOf(s.id);
    return h('div', { class: 'card sim' },
      h('div', { class: 'row' }, h('span', { class: 'badge' }, SKILLS[s.skill] || s.skill), s.level ? h('span', { class: 'badge m' }, s.level) : null, h('span', { class: 'sp' }), b ? h('span', { class: 'badge g', title: 'Ton meilleur score' }, 'Meilleur : ' + b.pct + ' %') : null),
      h('h3', {}, s.title), s.description ? h('p', {}, s.description) : null,
      h('div', { class: 'meta' }, s.q_count + ' questions' + (s.minutes ? ' · ' + s.minutes + ' min' : '')),
      h('button', { class: 'primary', onclick: () => openSim(s.id) }, b ? 'Refaire' : 'Commencer'));
  }));
}

// ====================== player ======================
let run = null, timerId = null;
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
async function openSim(id, preview) {
  try { const row = await dbGetSim(id); showIntro(row, !!preview); }
  catch (e) { console.error(e); toast('Impossible d’ouvrir cette simulation.', true); }
}
function showIntro(sim, preview) {
  const d = sim.data || { questions: [] };
  let mode = 'practice';
  const name = h('input', { placeholder: 'Ton prénom (facultatif)', value: ls('tcf_name') || '', maxlength: 60 });
  const modeBox = h('div', { class: 'row' },
    ...[['practice', 'Entraînement', 'Correction après chaque question'], ['exam', 'Examen', 'Correction à la fin' + (sim.minutes ? ', avec chronomètre' : '')]].map(([v, t, s]) =>
      h('label', { class: 'card', style: 'flex:1;min-width:200px;cursor:pointer;padding:12px' }, h('input', { type: 'radio', name: 'mode', value: v, checked: v === 'practice', style: 'width:auto;margin-right:8px', onchange: () => { mode = v; } }), h('b', {}, t), h('div', { class: 'sub' }, s))));
  setView(h('div', { class: 'player card' },
    h('div', { class: 'row' }, h('span', { class: 'badge' }, SKILLS[sim.skill] || sim.skill), sim.level ? h('span', { class: 'badge m' }, sim.level) : null),
    h('h2', { style: 'margin:8px 0 4px' }, sim.title), sim.description ? h('p', { class: 'sub' }, sim.description) : null,
    h('p', {}, d.questions.length + ' questions' + (sim.minutes ? ' · durée : ' + sim.minutes + ' min' : '')),
    modeBox, preview ? null : [h('label', { class: 'f' }, 'Ton nom'), name],
    h('div', { class: 'row', style: 'margin-top:16px' }, h('button', { class: 'primary', onclick: () => { ls('tcf_name', name.value.trim()); startRun(sim, d.questions.map((q, i) => i), mode, name.value.trim(), preview); } }, 'Commencer'), h('button', { onclick: () => preview ? showAdmin() : showLibrary() }, 'Retour'))));
}
function startRun(sim, idxs, mode, student, preview, noSave) {
  stopTimer();
  run = { sim, idxs, mode, student, preview, noSave, i: 0, answers: new Array(idxs.length).fill(null), locked: new Array(idxs.length).fill(false), t0: Date.now(), left: sim.minutes && mode === 'exam' && !noSave ? sim.minutes * 60 : 0 };
  if (run.left) timerId = setInterval(tick, 1000);
  renderQuestion();
}
function tick() { if (!run) return stopTimer(); run.left--; const t = $('#timer'); if (t) { t.textContent = fmtTime(Math.max(0, run.left)); t.classList.toggle('low', run.left <= 60); } if (run.left <= 0) { stopTimer(); toast('Temps écoulé !'); finishRun(); } }
const qOf = k => run.sim.data.questions[run.idxs[k]];
function renderQuestion() {
  const d = run.sim.data, k = run.i, q = qOf(k), n = run.idxs.length, exam = run.mode === 'exam';
  const cats = d.categoryNames || {};
  const done = run.locked[k];

      h('div', { class: 'row' }, h('b', {}, 'Q' + (i + 1)), catSel, txSel, h('span', { class: 'sp' }),
        h('button', { class: 'small', disabled: i === 0, onclick: () => { D.questions.splice(i - 1, 0, D.questions.splice(i, 1)[0]); mark(); paint(); } }, '↑'), h('button', { class: 'small', disabled: i === D.questions.length - 1, onclick: () => { D.questions.splice(i + 1, 0, D.questions.splice(i, 1)[0]); mark(); paint(); } }, '↓'),
        h('button', { class: 'small', onclick: () => { D.questions.splice(i + 1, 0, deep(q)); mark(); paint(); } }, 'Duplicate'), h('button', { class: 'small danger', onclick: () => { D.questions.splice(i, 1); mark(); paint(); } }, 'Delete')),
      h('label', { class: 'f' }, 'Question'), h('textarea', { rows: 2, value: q.prompt, oninput: e => { q.prompt = e.target.value; mark(); } }),
      h('label', { class: 'f' }, 'Options (select the correct one)'),
      q.options.map((o, j) => h('div', { class: 'oprow' }, h('input', { type: 'radio', name: 'c' + i + '_' + Math.random(), checked: q.correctIndex === j, onchange: () => { q.correctIndex = j; mark(); } }), h('input', { value: o, oninput: e => { q.options[j] = e.target.value; mark(); } }),
        h('button', { class: 'small danger', disabled: q.options.length <= 2, onclick: () => { q.options.splice(j, 1); if (q.correctIndex === j) q.correctIndex = 0; else if (q.correctIndex > j) q.correctIndex--; mark(); paint(); } }, '×'))),
      h('button', { class: 'small', onclick: () => { q.options.push(''); mark(); paint(); } }, '+ Option'),
      h('label', { class: 'f' }, 'Explanation (shown after answering)'), h('textarea', { rows: 2, value: q.explanation || '', oninput: e => { q.explanation = e.target.value; mark(); } }));
  }
  async function save() {
    if (!sim.title.trim()) return toast('Give the simulation a title.', true);
    const problems = []; D.questions.forEach((q, i) => { const filled = q.options.filter(o => o.trim()); if (!q.prompt.trim()) problems.push('Q' + (i + 1) + ' has no text'); if (filled.length < 2) problems.push('Q' + (i + 1) + ' needs 2+ options'); if (!q.options[q.correctIndex] || !q.options[q.correctIndex].trim()) problems.push('Q' + (i + 1) + ': the correct option is empty'); });
    if (!D.questions.length) problems.push('Add at least one question');
    if (problems.length) return toast(problems.slice(0, 3).join(' · '), true);
    // drop empty options but keep the correct index right
    const clean = deep(D); clean.questions.forEach(q => { const keep = q.options.map((o, j) => ({ o, j })).filter(x => x.o.trim()); q.correctIndex = keep.findIndex(x => x.j === q.correctIndex); q.options = keep.map(x => x.o); });
    try { const nid = await dbSaveSim({ ...sim, id: id, data: clean, sort: id ? undefined : adminSims.length }); id = nid; dirty = false; toast('Saved.'); modal.remove(); showAdmin('sims'); }
    catch (e) { console.error(e); toast((e.message || e) + (/relation|schema cache/i.test(e.message || '') ? ' — ' + SETUP_HINT : ''), true); }
  }
  paint(); $('#modal-host').append(modal);
}

// ---- results ----
async function renderResults() {
  const body = $('#admin-body'); let rows = [];
  try { const { data, error } = await sb.from('tcf_results').select('*').order('created_at', { ascending: false }).limit(1000); if (error) throw error; rows = data || []; showBanner(''); }
  catch (e) { showBanner(/relation|schema cache/i.test(e.message || '') ? SETUP_HINT : 'Error: ' + (e.message || e)); }
  const titles = [...new Set(rows.map(r => r.sim_title))];
  let f = '';
  const draw = () => {
    const list = rows.filter(r => !f || r.sim_title === f);
    const avg = list.length ? Math.round(list.reduce((a, r) => a + r.pct, 0) / list.length) : 0;
    const top = h('div', { class: 'row', style: 'margin-bottom:12px' },
      h('select', { style: 'max-width:280px', onchange: e => { f = e.target.value; draw(); } }, h('option', { value: '' }, 'All simulations'), titles.map(t => h('option', { value: t, selected: t === f }, t))),
      h('span', { class: 'badge' }, list.length + ' attempts'), list.length ? h('span', { class: 'badge g' }, 'Average ' + avg + ' %') : null, h('span', { class: 'sp' }),
      h('button', { onclick: () => download('tcf-results.csv', '﻿' + ['Date,Student,Simulation,Score,Total,Percent,Mode,Seconds', ...list.map(r => [new Date(r.created_at).toLocaleString(), r.student_name, r.sim_title, r.score, r.total, r.pct, r.mode, r.seconds].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(','))].join('\n'), 'text/csv'), disabled: !list.length }, 'Export CSV'));
    const tbl = list.length ? h('div', { class: 'card tw' }, h('table', {}, h('thead', {}, h('tr', {}, ['Date', 'Student', 'Simulation', 'Score', '%', 'Mode', 'Time', ''].map(x => h('th', {}, x)))), h('tbody', {}, list.map(r => h('tr', {}, h('td', {}, new Date(r.created_at).toLocaleString()), h('td', {}, r.student_name || '—'), h('td', {}, r.sim_title), h('td', {}, r.score + '/' + r.total), h('td', {}, h('b', {}, r.pct + ' %')), h('td', {}, r.mode === 'exam' ? 'Exam' : 'Practice'), h('td', {}, fmtTime(r.seconds || 0)), h('td', {}, h('button', { class: 'small danger', onclick: async () => { if (!confirm('Delete this result?')) return; const { error } = await sb.from('tcf_results').delete().eq('id', r.id); if (error) return toast(error.message, true); rows = rows.filter(x => x.id !== r.id); draw(); } }, '×'))))))) : h('div', { class: 'card empty' }, 'No results yet.');
    body.replaceChildren(top, tbl);
  };
  draw();
}

// ====================== boot ======================
$('#admin-btn').addEventListener('click', enterAdmin);
$('#to-student').addEventListener('click', showLibrary);
showLibrary();
</script>
